name: news
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
# GitHub 的定时触发经常被延迟几个小时（实测一晚只跑了 2 次），所以一个 run 内循环刷新快讯约 55 分钟，结束前自己再触发下一轮；
# 定时触发只当「断链后重启」的兜底。同组同时只跑一个。
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: live loop (fast news every 8 min)
        run: |
          git config user.name deepread-bot
          git config user.email bot@users.noreply.github.com
          for i in 1 2 3 4 5 6 7; do
            [ $i = 1 ] || [ $i = 4 ] && { python3 tools/fetch_picks.py --out data/picks.json || echo "精选源暂不可用"; }
            python3 tools/fetch_news.py --out data/news.json || true
            python3 tools/fetch_hot.py --out data/hot.json || echo "热榜源暂不可用"
            python3 tools/translate_news.py --news data/news.json --trans data/translations.json || true
            git add data/news.json data/translations.json data/picks.json data/hot.json
            if ! git diff --cached --quiet; then
              git commit -q -m "live $(date -u +%FT%TZ)"
              for k in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
            fi
            [ $i = 7 ] || sleep 420
          done
      - name: fetch news history for quiz
        run: python3 tools/fetch_news_history.py --days 14 --out data/news_history.json || echo "历史快讯源暂不可用，沿用上次 news_history.json"
      - name: translate english news
        run: python3 tools/translate_news.py --news data/news.json --trans data/translations.json
      - name: build news to stock moves
        run: python3 tools/build_moves.py --news data/news.json --out data/moves.json || echo "行情接口暂不可用，沿用上次 moves.json"
      - name: build news-time to nasdaq minute moves
        run: |
          python3 tools/build_events.py --news data/news.json --out data/events.json \
            || python3 tools/build_events.py --patch-only --out data/events.json \
            || echo "分时与报价均暂不可用，沿用上次 events.json"
      - name: build guess up/down quiz
        run: python3 tools/build_quiz.py --news data/news.json --history data/news_history.json --out data/quiz.json || echo "题库今日已生成或行情暂不可用，沿用上次 quiz.json"
      - name: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name deepread-bot
          git config user.email bot@users.noreply.github.com
          git add data/news.json data/translations.json data/picks.json data/moves.json data/events.json data/quiz.json data/news_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "news $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
      - name: chain next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml -R "${{ github.repository }}" --ref main || echo "自触发失败，等定时兜底"